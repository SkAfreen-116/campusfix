spring.application.name=campusfix-api-test

# In-memory H2 database in MySQL compatibility mode
spring.datasource.url=jdbc:h2:mem:campusfix;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDER=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate validate mode to strictly enforce schema match with Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Actuator & CORS
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
campusfix.cors.allowed-origins=http://localhost:5173
