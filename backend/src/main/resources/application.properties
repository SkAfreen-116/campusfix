spring.application.name=campusfix-api

# Database DataSource configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/campusfix?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:campusfix}
spring.datasource.password=${DB_PASSWORD:campusfix_secret}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Spring Boot Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# CORS allowed origins
campusfix.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# Server port
server.port=8080
